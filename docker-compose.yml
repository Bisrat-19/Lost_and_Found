services:
  db:
    image: postgres:17-alpine
    container_name: lost-and-found-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lostfound
      POSTGRES_PASSWORD: lostfound
      POSTGRES_DB: lostfound
    ports:
      - "5433:5432" # host 5433 to avoid clashing with a local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lostfound -d lostfound"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
